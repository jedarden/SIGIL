[package]
name = "sigil-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core types and traits for SIGIL secret management"

[features]
default = []
dynamic = ["reqwest", "aws-config", "aws-sdk-sts"]
# NOTE: Backend features disabled due to cyclic dependency - needs refactoring
# Backend routing should be in a separate crate (sigil-backend-router) rather than sigil-core
# backend-vault = ["sigil-backend-vault"]
# backend-onepassword = ["sigil-backend-onepassword"]
# backend-pass = ["sigil-backend-pass"]
# backend-aws = ["sigil-backend-aws"]
# backend-sops = ["sigil-backend-sops"]
# backend-env = ["sigil-backend-env"]
# all-backends = ["backend-vault", "backend-onepassword", "backend-pass", "backend-aws", "backend-sops", "backend-env"]

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Secret handling
zeroize = { workspace = true }
secrecy = { workspace = true }

# Cryptography
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
age = { workspace = true, features = ["cli-common"] }
rmp-serde = { workspace = true }

# Concurrent data structures
crossbeam-channel = "0.5"

# Parsing
regex = "1"
lazy_static = "1"

# Platform-specific
nix = { workspace = true }
which = "7"
atty = "0.2"
terminal_size = "0.4"

# Filesystem monitoring
notify = { workspace = true }

# AWS SDK for dynamic credentials (optional, for "dynamic" feature)
aws-config = { version = "1.5", features = ["behavior-version-latest"], optional = true }
aws-sdk-sts = { version = "1.37", optional = true }

# HTTP client for Vault API (optional, for "dynamic" feature)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# External backend crates (optional, enabled via feature flags)
# NOTE: Disabled due to cyclic dependency - needs refactoring
# sigil-backend-vault = { path = "../sigil-backend-vault", optional = true }
# sigil-backend-onepassword = { path = "../sigil-backend-onepassword", optional = true }
# sigil-backend-pass = { path = "../sigil-backend-pass", optional = true }
# sigil-backend-aws = { path = "../sigil-backend-aws", optional = true }
# sigil-backend-sops = { path = "../sigil-backend-sops", optional = true }
# sigil-backend-env = { path = "../sigil-backend-env", optional = true }

# Time
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.5"
